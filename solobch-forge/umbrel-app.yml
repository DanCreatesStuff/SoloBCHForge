  - https://cdn.jsdelivr.net/gh/DanCreatesStuff/SoloBCHForge@main/solobch-forge/1.jpg
  - https://cdn.jsdelivr.net/gh/DanCreatesStuff/SoloBCHForge@main/solobch-forge/2.jpg
  - https://cdn.jsdelivr.net/gh/DanCreatesStuff/SoloBCHForge@main/solobch-forge/3.jpg
path: ""
defaultPassword: ""
releaseNotes: >-
  New "Is this working?" button at the top of Settings: runs a step-by-step
  check of your whole setup (settings, node, block building, Stratum port, your
  miner and its shares), stops at the first problem and shows a potential fix.
  Includes the 1.1.1 reliability and security fixes: recovery from slow node
  responses, 30-second template refreshes so new fees are included, a working
  ZMQ instant-job feed on Umbrel, hardened dashboard and settings API, bounded
  memory over long sessions, and prompt restarts.
submitter: DanCreatesStuff
submission: https://github.com/DanCreatesStuff/SoloBCHForge
