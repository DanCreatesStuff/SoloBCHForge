name: Build & push multi-arch image

# Publishes ghcr.io/<owner>/solobch-forge for linux/amd64 + linux/arm64.
# Triggers:
#   - pushing a version tag like v1.0.0  -> tags :1.0.0 and :latest
#   - manual "Run workflow" button       -> tags :latest (and the short SHA)
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # needed to push to GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/solobch-forge" >> "$GITHUB_ENV"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false          # keep the manifest a plain multi-arch list

      - name: Show digest to pin in docker-compose.yml
        run: |
          echo "Pin this in solobch-forge/docker-compose.yml:"
          echo "  image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
