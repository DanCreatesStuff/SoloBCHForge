# SoloBCH Forge - dev/standalone compose for Umbrel.
# Connects to the existing Bitcoin Cash Node app over Umbrel's shared network.
# The RPC password comes from ./.env (BCHN_RPC_PASSWORD=...), never from the image.

services:
  stratum:
    build: .
    image: solobch-forge:dev
    container_name: solobch-forge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - BCHN_RPC_HOST=bitcoind          # in-network hostname of the BCHN app
      - BCHN_RPC_PORT=8332
      - BCHN_RPC_USER=umbrel
      - BCHN_RPC_PASSWORD=${BCHN_RPC_PASSWORD:?set BCHN_RPC_PASSWORD in ~/bch-stratum/.env}
      - APP_DATA_DIR=/data              # config.json persistence (mirrors the Umbrel app)
      - PYTHONUNBUFFERED=1
    ports:
      - "3334:3334"                     # Stratum (miners, LAN)
      # Status dashboard + settings API. Unlike the Umbrel app there is NO
      # authentication in front of it here: anyone on the LAN can change
      # settings, so bind it to localhost ("127.0.0.1:3335:3335") or a trusted
      # interface if the LAN is not fully trusted.
      - "3335:3335"
    volumes:
      - ./server:/app/server:ro         # dev: edit + `compose restart` picks it up, no rebuild
      - ./data:/data                    # persistent config.json
    networks:
      - umbrel_main_network

networks:
  umbrel_main_network:
    external: true
