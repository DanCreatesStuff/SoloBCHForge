version: "3.7"

services:
  app_proxy:
    environment:
      # Route Umbrel's authenticated web UI to our status dashboard.
      APP_HOST: solobch-forge_server_1
      APP_PORT: 3335

  server:
    # Public multi-arch image pushed to GHCR (see .github/workflows/docker-publish.yml).
    # Best practice: after the first CI build, swap the tag for the digest it prints:
    #   image: ghcr.io/dancreatesstuff/solobch-forge@sha256:<digest>
    image: ghcr.io/dancreatesstuff/solobch-forge:1.1.1
    # Umbrel owns the app's data dir as UID 1000, so run as 1000:1000 (the image's
    # baked-in user is a different UID and cannot write to /data). The shipped
    # data/ folder is copied in 1000-owned on install so this works on a fresh box.
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "3334:3334"                 # Stratum for miners (LAN)
    volumes:
      - ${APP_DATA_DIR}/data:/data  # persistent config.json + state
    # Docker's default json-file driver never rotates: cap the log so months of
    # share lines cannot fill a Pi's SD card.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      APP_DATA_DIR: /data
      PYTHONUNBUFFERED: "1"
      # Connect to the Bitcoin Cash Node app via the values it exports to every
      # Umbrel app (see its exports.sh). Cross-app DNS by service name does not
      # work under umbreld, so we use the injected node IP — not "bitcoind".
      # The RPC password is provided by Umbrel too, so no manual entry is needed.
      # Environment values take precedence over config.json, so these four
      # fields show as locked on the app's Settings page.
      BCHN_RPC_HOST: ${APP_BITCOIN_CASH_NODE_NODE_IP}
      BCHN_RPC_PORT: ${APP_BITCOIN_CASH_NODE_RPC_PORT}
      BCHN_RPC_USER: ${APP_BITCOIN_CASH_NODE_RPC_USER}
      BCHN_RPC_PASSWORD: ${APP_BITCOIN_CASH_NODE_RPC_PASS}
      # The node app publishes ZMQ hashblock on this port (it runs
      # -zmqpubhashblock=tcp://0.0.0.0:28332 and exports the port). Same DNS
      # caveat as above: the built-in default "tcp://bitcoind:28332" cannot
      # resolve here, so build the endpoint from the injected IP.
      SOLOBCH_ZMQ_ENDPOINT: tcp://${APP_BITCOIN_CASH_NODE_NODE_IP}:${APP_BITCOIN_CASH_NODE_ZMQ_HASHBLOCK_PORT}
