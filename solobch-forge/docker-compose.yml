version: "3.7"

services:
  app_proxy:
    environment:
      # Route Umbrel's authenticated web UI to our status dashboard.
      APP_HOST: solobch-forge_server_1
      APP_PORT: 3335

  server:
    # Public multi-arch image pushed to GHCR (see .github/workflows/docker-publish.yml).
    # Best practice: after the first CI build, swap the tag for the digest it prints:
    #   image: ghcr.io/dancreatesstuff/solobch-forge@sha256:<digest>
    image: ghcr.io/dancreatesstuff/solobch-forge:1.0.0
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "3334:3334"                 # Stratum for miners (LAN)
    volumes:
      - ${APP_DATA_DIR}/data:/data  # persistent config.json + state
    environment:
      APP_DATA_DIR: /data
      PYTHONUNBUFFERED: "1"
      # RPC connection defaults to the Bitcoin Cash Node app; the password is
      # NOT baked in — it is read from /data/config.json (set via the app).
      BCHN_RPC_HOST: bitcoind
      BCHN_RPC_PORT: "8332"
      BCHN_RPC_USER: umbrel
