releaseNotes: >-
  New "miner offline" webhook alert — get notified when a miner drops off and
  stays disconnected for over 2 minutes. Notifications now have individual
  on/off switches on the Settings page (block found, new best share, miner
  offline), so you can enable exactly the alerts you want.
submitter: DanCreatesStuff
