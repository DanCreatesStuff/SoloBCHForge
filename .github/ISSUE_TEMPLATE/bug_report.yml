name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill out the sections
        below so it can be reproduced and fixed quickly.

        ⚠️ **Do not report security vulnerabilities here** — see
        [SECURITY.md](https://github.com/DanCreatesStuff/SoloBCHForge/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: The dashboard showed... but I expected...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can this be reproduced?
      placeholder: |
        1. Point miner at stratum+tcp://...
        2. Open the dashboard
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SoloBCH Forge version
      description: Shown in the Umbrel app store (e.g. 1.0.5).
      placeholder: "1.0.5"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - Umbrel community app store
        - Standalone Docker / docker compose
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: miner
    attributes:
      label: Miner hardware / firmware
      description: e.g. NerdQaxe++ / AxeOS v1.1.0, Bitaxe, etc.
      placeholder: NerdQaxe++ / BM1370 / v1.1.0
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >-
        Paste any relevant server logs. Redact your RPC password and anything
        sensitive. This is automatically formatted as code.
      render: shell
    validations:
      required: false
