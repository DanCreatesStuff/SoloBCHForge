version: "3.7"

services:
  app_proxy:
    environment:
      # Route Umbrel's authenticated web UI to our status dashboard.
      APP_HOST: solobch-forge_server_1
      APP_PORT: 3335

  server:
    # Public multi-arch image pushed to GHCR (see .github/workflows/docker-publish.yml).
    # Best practice: after the first CI build, swap the tag for the digest it prints:
    #   image: ghcr.io/dancreatesstuff/solobch-forge@sha256:<digest>
    image: ghcr.io/dancreatesstuff/solobch-forge:1.0.0
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "3334:3334"                 # Stratum for miners (LAN)
    volumes:
      - ${APP_DATA_DIR}/data:/data  # persistent config.json + state
    environment:
      APP_DATA_DIR: /data
      PYTHONUNBUFFERED: "1"
      # Connect to the Bitcoin Cash Node app via the values it exports to every
      # Umbrel app (see its exports.sh). Cross-app DNS by service name does not
      # work under umbreld, so we use the injected node IP — not "bitcoind".
      # The RPC password is provided by Umbrel too, so no manual entry is needed
      # (anything set in the app's Settings UI still takes precedence).
      BCHN_RPC_HOST: ${APP_BITCOIN_CASH_NODE_NODE_IP}
      BCHN_RPC_PORT: ${APP_BITCOIN_CASH_NODE_RPC_PORT}
      BCHN_RPC_USER: ${APP_BITCOIN_CASH_NODE_RPC_USER}
      BCHN_RPC_PASSWORD: ${APP_BITCOIN_CASH_NODE_RPC_PASS}
